<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountain Scope</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#090A0D;
  --panel:#12141A;
  --panel-2:#171A22;
  --panel-3:#1D212B;
  --border:#292D38;
  --text:#F4F5F7;
  --dim:#A2A7B3;
  --faint:#686E7B;
  --orange:#F5893A;
  --orange-soft:#392717;
  --green:#42D392;
  --yellow:#E8C547;
  --blue:#55A7FF;
  --red:#F06B5F;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  padding:28px;
}
button,input,textarea{font-family:inherit}
.wrap{max-width:1400px;margin:0 auto}
header{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  margin-bottom:24px;
}
h1{font-size:28px;font-weight:800;line-height:1.15}
.subtitle{margin-top:6px;color:var(--dim);font-size:14px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text);
  padding:9px 13px;
  border-radius:8px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.btn.primary{background:var(--orange-soft);border-color:var(--orange);color:var(--orange)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.grid{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
}
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.metric{
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
}
.metric-label{color:var(--faint);font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.04em}
.metric-value{font-size:26px;font-weight:800;margin-top:4px}
.bar{height:8px;border-radius:999px;background:var(--panel-3);overflow:hidden;margin-top:10px}
.fill{height:100%;background:var(--orange);width:0}
.section-title{font-size:13px;font-weight:800;margin:18px 0 10px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.project-selector{position:relative;display:inline-block}
.project-button{
  border:none;
  background:transparent;
  color:var(--text);
  font-size:28px;
  font-weight:800;
  line-height:1.15;
  cursor:pointer;
  padding:0;
  text-align:left;
}
.project-menu{
  position:absolute;
  left:0;
  top:calc(100% + 10px);
  min-width:220px;
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px;
  z-index:10;
  display:none;
  box-shadow:0 18px 40px rgba(0,0,0,.35);
}
.project-menu.open{display:block}
.project-option{
  width:100%;
  border:none;
  background:transparent;
  color:var(--text);
  text-align:left;
  padding:9px 10px;
  border-radius:7px;
  cursor:pointer;
  font-weight:700;
}
.project-option:hover{background:var(--panel-3)}
.project-option.active{color:var(--orange)}
.roadmap-shell{margin-top:8px}
.phase-rail{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:4px 0 12px;
  border-bottom:1px solid var(--border);
}
.phase{
  min-width:190px;
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  background:var(--panel-2);
}
.phase.active{border-color:var(--orange);box-shadow:0 0 0 1px rgba(245,137,58,.25)}
.phase-head{
  padding:12px;
  background:transparent;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:stretch;
}
.phase-actions,.topic-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{
  width:28px;
  height:28px;
  border:1px solid var(--border);
  background:var(--panel-3);
  color:var(--dim);
  border-radius:7px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.icon-btn:hover{border-color:var(--orange);color:var(--orange)}
.phase-name{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phase-progress{font-size:12px;color:var(--orange);font-weight:800}
.topic-list{padding-top:12px}
.topic-list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.topic-list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.topic{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:var(--text);
  padding:6px;
  border-radius:7px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:9px;
  align-items:center;
}
.topic:hover,.topic.active{background:var(--panel-3);border-color:var(--border)}
.topic-select{
  border:none;
  background:transparent;
  color:var(--text);
  display:grid;
  grid-template-columns:10px minmax(0,1fr) auto;
  gap:9px;
  align-items:center;
  min-width:0;
  text-align:left;
  cursor:pointer;
  padding:4px;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.dot.complete{background:var(--green)}
.dot.partial{background:var(--yellow)}
.dot.not_verified{background:var(--blue)}
.dot.missing{background:var(--red)}
.topic-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic-score{font-size:12px;color:var(--faint);font-weight:800}
.workspace-head{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-start;
  margin-bottom:14px;
}
.topic-title{font-size:22px;font-weight:800}
.status-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--border);
  border-radius:999px;
  padding:6px 10px;
  color:var(--dim);
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}
.status-pill.complete{border-color:var(--green);color:var(--green)}
.status-pill.partial{border-color:var(--yellow);color:var(--yellow)}
.status-pill.not_verified{border-color:var(--blue);color:var(--blue)}
.status-pill.missing{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow:auto}
.tab{
  border:none;
  background:transparent;
  color:var(--dim);
  padding:10px 12px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  border-bottom:2px solid transparent;
  white-space:nowrap;
}
.tab.active{color:var(--orange);border-color:var(--orange)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin-bottom:10px}
.card p,.card li{font-size:13px;line-height:1.6;color:var(--dim)}
ul{list-style:none}
li{padding:4px 0}
li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-right:8px;vertical-align:middle}
textarea,input{
  width:100%;
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  padding:11px 12px;
  font-size:13px;
  outline:none;
}
textarea:focus,input:focus{border-color:var(--orange)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.resource{
  border:1px solid var(--border);
  background:var(--panel-2);
  border-radius:8px;
  padding:14px;
  margin-bottom:10px;
}
.resource-source{color:var(--faint);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.resource-title{color:var(--text);font-size:15px;font-weight:800;margin-bottom:6px}
.resource-description{color:var(--dim);font-size:13px;line-height:1.55;margin-bottom:12px}
.resource a{color:var(--orange);font-weight:800;text-decoration:none;font-size:13px}
.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:var(--panel-2);
  border:1px solid var(--orange);
  color:var(--text);
  border-radius:8px;
  padding:11px 14px;
  display:none;
  max-width:420px;
  font-size:13px;
}
.empty{color:var(--faint);font-size:13px;line-height:1.7;text-align:center;padding:34px 10px}
.small{font-size:12px;color:var(--faint);line-height:1.5}
.add-row{width:100%;margin-top:8px}
.phase-add{min-width:150px;align-self:stretch}
@media (max-width:900px){
  body{padding:18px}
  header,.workspace-head{flex-direction:column}
  .two-col,.field-row{grid-template-columns:1fr}
  .actions{justify-content:flex-start}
  .project-button{font-size:24px}
  .phase{min-width:165px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="project-selector">
        <button class="project-button" id="projectButton">▾ Mountain Scope</button>
        <div class="project-menu" id="projectMenu"></div>
      </div>
      <div class="subtitle" id="subtitle">Curriculum-driven learning roadmap with evidence-based progress.</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </header>

  <main class="grid">
    <aside class="panel">
      <div class="metric-row">
        <div class="metric">
          <div class="metric-label">Overall</div>
          <div class="metric-value" id="overall">0%</div>
          <div class="bar"><div class="fill" id="overallFill"></div></div>
        </div>
        <div class="metric">
          <div class="metric-label">Topics</div>
          <div class="metric-value" id="topicCount">0</div>
        </div>
      </div>

      <div class="section-title">Progress Intelligence</div>
      <div class="card">
        <p><strong>Recommended:</strong> <span id="recommended">None</span></p>
        <p><strong>Remaining:</strong> <span id="remaining">0 hours</span></p>
      </div>

      <div class="section-title">Roadmap</div>
      <div id="roadmap"></div>
    </aside>

    <section class="panel" id="workspace">
      <div class="empty">Select a topic to open the workspace.</div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { readApiJson } from './client-response.js';

const STATE_KEY = 'mountain-scope:v2-curriculum';
const API_URL = '/api/workflow';
const TOPIC_STATES = ['complete','partial','not_verified','missing'];

let state = null;
let selectedTopicId = null;
let selectedPhaseId = null;
let activeTab = 'overview';
let saveTimer = null;

function uid(){ return Math.random().toString(36).slice(2,10); }
function now(){ return new Date().toISOString(); }

function blankTopic(name){
  return {
    id: uid(), name, description:'', objectives:[], deliverables:[], successCriteria:[name],
    keywords:name.toLowerCase().split(/\s+/).filter(w=>w.length>2), glossary:[],
    resources:{ static:[], dynamic:[] }, status:'not_verified', completion:0,
    notes:'', chatHistory:[], manualOverride:null
  };
}

function defaultState(){
  const phases = [
    { id:uid(), name:'Requirements', projects:[], topics:[blankTopic('Read the official project brief'), blankTopic('Extract mandatory requirements')] },
    { id:uid(), name:'Planning', projects:[], topics:[blankTopic('Design project phases'), blankTopic('Identify learning topics')] },
    { id:uid(), name:'Build', projects:[], topics:[blankTopic('Implement core requirements'), blankTopic('Review completion criteria')] }
  ];
  return {
    title:'Mountain Scope',
    subtitle:'Curriculum-driven learning roadmap with evidence-based progress.',
    curriculum:{ id:uid(), title:'42 Project Curriculum', source:{name:'Default roadmap',type:'seed',importedAt:now()}, phases, glossary:[], resources:[], versionHistory:[] },
    phases: phases.map(p=>({ id:p.id, name:p.name, topics:p.topics, documents:[] })),
    progress:null
  };
}

function projectFromRoot(input){
  return {
    id:input.activeProjectId || uid(),
    title:input.curriculum?.title || input.title || 'Mountain Scope',
    subtitle:input.subtitle || 'Curriculum-driven learning roadmap with evidence-based progress.',
    curriculum:input.curriculum,
    phases:input.phases || [],
    progress:input.progress || null
  };
}

function blankProject(title){
  const curriculum = { id:uid(), title, source:{name:'Manual project',type:'manual',importedAt:now()}, phases:[], glossary:[], resources:[], versionHistory:[] };
  return { id:uid(), title, subtitle:'Curriculum-driven learning roadmap with evidence-based progress.', curriculum, phases:[], progress:null };
}

function apiRequest(url, options={}){
  return fetch(url, {
    ...options,
    headers:{ 'Content-Type':'application/json', ...(options.headers||{}) }
  });
}

async function loadState(){
  try{
    const response = await apiRequest(API_URL);
    const payload = await readApiJson(response, 'Load workflow failed');
    state = payload.workflow ? migrate(payload.workflow) : migrate(readLocal() || defaultState());
    if(!payload.workflow) await persist();
  }catch(error){
    state = migrate(readLocal() || defaultState());
    showToast('Offline mode. Changes are kept locally.');
  }
  selectedTopicId = allTopics()[0]?.id || null;
  selectedPhaseId = selectedTopicId ? phaseForTopic(selectedTopicId)?.id : (state.curriculum?.phases||[])[0]?.id || null;
  render();
}

function readLocal(){
  const raw = localStorage.getItem(STATE_KEY);
  return raw ? JSON.parse(raw) : null;
}

function migrate(input){
  const next = input || defaultState();
  delete next.repository;
  if(!next.curriculum){
    next.curriculum = {
      id:uid(), title:next.title || 'Mountain Scope', source:{name:'Migrated workflow',type:'legacy',importedAt:now()},
      phases:(next.phases||[]).map(p=>({ id:p.id||uid(), name:p.name, projects:[], topics:(p.topics||[]).map(t=>enrichTopic(t)) })),
      glossary:[], resources:[], versionHistory:[]
    };
  }
  next.curriculum.phases.forEach(p=>{
    if(!p.projects) p.projects = [];
    p.topics = (p.topics||[]).map(enrichTopic);
    p.projects.forEach(project=>{ project.topics = (project.topics||[]).map(enrichTopic); });
  });
  next.phases = next.curriculum.phases.map(p=>({ id:p.id, name:p.name, topics:phaseTopics(p), documents:[] }));
  next.progress = calculateProgress(next);
  ensureProjects(next);
  applyActiveProject(next);
  return next;
}

function ensureProjects(next){
  if(!Array.isArray(next.projects) || !next.projects.length){
    const project = projectFromRoot(next);
    next.projects = [project];
    next.activeProjectId = project.id;
  }
  if(!next.activeProjectId || !next.projects.some(project=>project.id===next.activeProjectId)){
    next.activeProjectId = next.projects[0].id;
  }
}

function activeProject(){ return state.projects.find(project=>project.id===state.activeProjectId) || state.projects[0]; }
function captureActiveProject(){
  const project = activeProject();
  if(!project) return;
  project.title = state.curriculum?.title || state.title || project.title;
  project.subtitle = state.subtitle || project.subtitle || '';
  project.curriculum = state.curriculum;
  project.phases = state.phases;
  project.progress = state.progress;
}
function applyActiveProject(next=state){
  const project = next.projects.find(item=>item.id===next.activeProjectId) || next.projects[0];
  if(!project) return;
  project.curriculum.phases.forEach(phase=>{
    if(!phase.projects) phase.projects = [];
    phase.topics = (phase.topics||[]).map(enrichTopic);
    phase.projects.forEach(projectItem=>{ projectItem.topics = (projectItem.topics||[]).map(enrichTopic); });
  });
  next.title = project.title;
  next.subtitle = project.subtitle || 'Curriculum-driven learning roadmap with evidence-based progress.';
  next.curriculum = project.curriculum;
  next.phases = next.curriculum.phases.map(phase=>({ id:phase.id, name:phase.name, description:phase.description||'', topics:phaseTopics(phase), documents:[] }));
  next.progress = calculateProgress(next);
}

function syncRootIntoActiveProject(next){
  if(!Array.isArray(next.projects) || !next.activeProjectId) return next;
  const project = next.projects.find(item=>item.id===next.activeProjectId);
  if(!project) return next;
  project.title = next.curriculum?.title || next.title || project.title;
  project.subtitle = next.subtitle || project.subtitle || '';
  project.curriculum = next.curriculum;
  project.phases = next.phases;
  project.progress = next.progress;
  return next;
}

function enrichTopic(t){
  return {
    id:t.id||uid(), name:t.name||'Untitled Topic', description:t.description||'',
    objectives:t.objectives||[], deliverables:t.deliverables||[], successCriteria:t.successCriteria||t.activities||[],
    keywords:t.keywords||[], glossary:t.glossary||[], resources:t.resources||{static:[],dynamic:[]},
    status:normaliseStatus(t.status), completion:typeof t.completion==='number'?t.completion:undefined,
    notes:t.notes||'', chatHistory:t.chatHistory||[], manualOverride:t.manualOverride||null
  };
}

function normaliseStatus(status){
  if(status === 'completed') return 'complete';
  if(status === 'in_progress') return 'partial';
  if(status === 'not_started') return 'not_verified';
  return TOPIC_STATES.includes(status) ? status : 'not_verified';
}

function phaseTopics(phase){ return [...(phase.topics||[]), ...(phase.projects||[]).flatMap(p=>p.topics||[])]; }
function allTopics(){ return (state?.curriculum?.phases||[]).flatMap(phaseTopics); }
function selectedTopic(){ return allTopics().find(t=>t.id===selectedTopicId) || null; }
function selectedPhase(){ return (state?.curriculum?.phases||[]).find(phase=>phase.id===selectedPhaseId) || (selectedTopicId && phaseForTopic(selectedTopicId)) || (state?.curriculum?.phases||[])[0] || null; }
function phaseForTopic(topicId){ return (state?.curriculum?.phases||[]).find(phase=>phaseTopics(phase).some(topic=>topic.id===topicId)) || null; }
function topicCompletion(topic){
  if(topic.manualOverride?.completed) return 100;
  if(typeof topic.completion === 'number') return Math.max(0, Math.min(100, topic.completion));
  if(topic.status === 'complete') return 100;
  if(topic.status === 'partial') return 50;
  return 0;
}
function calculateProgress(next){
  const topics = (next.curriculum?.phases||[]).flatMap(phaseTopics);
  const overall = topics.length ? Math.round(topics.reduce((sum,t)=>sum+topicCompletion(t),0)/topics.length) : 0;
  const phases = (next.curriculum?.phases||[]).map(p=>{
    const topicsForPhase = phaseTopics(p);
    const completion = topicsForPhase.length ? Math.round(topicsForPhase.reduce((sum,t)=>sum+topicCompletion(t),0)/topicsForPhase.length) : 0;
    return { id:p.id, name:p.name, completion };
  });
  const needs = topics.filter(t=>topicCompletion(t)<70);
  return {
    overall, phases,
    strongestTopics:topics.filter(t=>topicCompletion(t)>=80).map(t=>t.name).slice(0,5),
    needsImprovement:needs.map(t=>t.name).slice(0,5),
    recommendedNextTopic:needs[0]?.name || null,
    estimatedRemainingWork:`${Math.max(1, needs.length*2)} hours`
  };
}

async function persist(){
  state.progress = calculateProgress(state);
  captureActiveProject();
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
  try{
    const response = await apiRequest(API_URL, { method:'PUT', body:JSON.stringify({workflow:state}) });
    await readApiJson(response, 'Online save failed');
  }catch(error){
    showToast(`${error.message} Local backup kept.`);
  }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist,350); }

const ProjectStructureManager = {
  async apply(response, actionName){
    const payload = await readApiJson(response, actionName);
    state = migrate(syncRootIntoActiveProject(payload.workflow || state));
    captureActiveProject();
    if(!selectedTopic() && allTopics().length) selectedTopicId = allTopics()[0].id;
    if(!selectedPhase()) selectedPhaseId = (state.curriculum?.phases||[])[0]?.id || null;
    if(!allTopics().length) selectedTopicId = null;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
    render();
    persist();
    return payload;
  }
};

const ProjectSelector = {
  render(){
    const current = activeProject();
    document.getElementById('projectButton').textContent = `▾ ${current?.title || 'Mountain Scope'}`;
    const menu = document.getElementById('projectMenu');
    menu.innerHTML = `
      <div class="small" style="padding:6px 10px">Projects</div>
      ${state.projects.map(project=>`<button class="project-option ${project.id===state.activeProjectId?'active':''}" data-project-id="${project.id}">${project.id===state.activeProjectId?'✓ ':''}${escapeHtml(project.title)}</button>`).join('')}
      <button class="project-option" data-action="create-project">- Create Project</button>
    `;
    menu.querySelectorAll('[data-project-id]').forEach(btn=>btn.addEventListener('click',()=>this.switch(btn.dataset.projectId)));
    menu.querySelector('[data-action="create-project"]').addEventListener('click',()=>this.create());
  },
  toggle(){ document.getElementById('projectMenu').classList.toggle('open'); },
  switch(projectId){
    if(projectId === state.activeProjectId) return document.getElementById('projectMenu').classList.remove('open');
    captureActiveProject();
    state.activeProjectId = projectId;
    applyActiveProject();
    selectedTopicId = allTopics()[0]?.id || null;
    selectedPhaseId = selectedTopicId ? phaseForTopic(selectedTopicId)?.id : (state.curriculum?.phases||[])[0]?.id || null;
    document.getElementById('projectMenu').classList.remove('open');
    persist();
    render();
  },
  create(){
    const title = prompt('Project name:');
    if(title === null) return;
    const clean = title.trim();
    if(!clean){ showToast('Project name is required.'); return; }
    if(state.projects.some(project=>project.title.trim().toLowerCase()===clean.toLowerCase())){ showToast('A project with this name already exists.'); return; }
    captureActiveProject();
    const project = blankProject(clean);
    state.projects.push(project);
    state.activeProjectId = project.id;
    applyActiveProject();
    selectedTopicId = null;
    selectedPhaseId = null;
    document.getElementById('projectMenu').classList.remove('open');
    persist();
    render();
  }
};

const PhaseService = {
  validateName(name, phaseId=null){
    const clean = name.trim();
    if(!clean) throw new Error('Phase name is required.');
    if((state.curriculum?.phases||[]).some(phase=>phase.id!==phaseId && phase.name.trim().toLowerCase()===clean.toLowerCase())) throw new Error('A phase with this name already exists.');
    return clean;
  },
  async add(){
    const name = prompt('Phase name:');
    if(name === null) return;
    try{
      const clean = this.validateName(name);
      const description = prompt('Description (optional):') || '';
      const response = await apiRequest('/api/phases', { method:'POST', body:JSON.stringify({name:clean, description}) });
      await ProjectStructureManager.apply(response, 'Add phase failed');
    }catch(error){ showToast(error.message); }
  },
  async rename(phase){
    const name = prompt('Phase name:', phase.name || '');
    if(name === null) return;
    try{
      const clean = this.validateName(name, phase.id);
      const response = await apiRequest(`/api/phases/${phase.id}`, { method:'PATCH', body:JSON.stringify({name:clean}) });
      await ProjectStructureManager.apply(response, 'Rename phase failed');
    }catch(error){ showToast(error.message); }
  },
  async remove(phase){
    if(!confirm(`Delete phase "${phase.name}"?\n\nThis will also delete every topic inside this phase.`)) return;
    try{
      const response = await apiRequest(`/api/phases/${phase.id}`, { method:'DELETE' });
      await ProjectStructureManager.apply(response, 'Delete phase failed');
    }catch(error){ showToast(error.message); }
  },
  async move(phase, direction){
    try{
      const response = await apiRequest(`/api/phases/${phase.id}/move`, { method:'POST', body:JSON.stringify({direction}) });
      await ProjectStructureManager.apply(response, 'Move phase failed');
    }catch(error){ showToast(error.message); }
  }
};

const TopicService = {
  validateName(phase, name, topicId=null){
    const clean = name.trim();
    if(!clean) throw new Error('Topic name is required.');
    if(phaseTopics(phase).some(topic=>topic.id!==topicId && topic.name.trim().toLowerCase()===clean.toLowerCase())) throw new Error('A topic with this name already exists in this phase.');
    return clean;
  },
  async add(phase){
    const name = prompt('Topic name:');
    if(name === null) return;
    try{
      const clean = this.validateName(phase, name);
      const description = prompt('Description (optional):') || '';
      const response = await apiRequest('/api/topics', { method:'POST', body:JSON.stringify({phase_id:phase.id, name:clean, description}) });
      const payload = await ProjectStructureManager.apply(response, 'Add topic failed');
      selectedTopicId = payload.topic?.id || selectedTopicId;
      render();
    }catch(error){ showToast(error.message); }
  },
  async rename(phase, topic){
    const name = prompt('Topic name:', topic.name || '');
    if(name === null) return;
    try{
      const clean = this.validateName(phase, name, topic.id);
      const response = await apiRequest(`/api/topics/${topic.id}`, { method:'PATCH', body:JSON.stringify({name:clean}) });
      await ProjectStructureManager.apply(response, 'Rename topic failed');
    }catch(error){ showToast(error.message); }
  },
  async remove(topic){
    if(!confirm(`Delete topic "${topic.name}"?`)) return;
    try{
      const response = await apiRequest(`/api/topics/${topic.id}`, { method:'DELETE' });
      await ProjectStructureManager.apply(response, 'Delete topic failed');
    }catch(error){ showToast(error.message); }
  },
  async move(topic, direction){
    try{
      const response = await apiRequest(`/api/topics/${topic.id}/move`, { method:'POST', body:JSON.stringify({direction}) });
      await ProjectStructureManager.apply(response, 'Move topic failed');
    }catch(error){ showToast(error.message); }
  }
};

function render(){
  state.progress = calculateProgress(state);
  captureActiveProject();
  ProjectSelector.render();
  document.getElementById('subtitle').textContent = state.subtitle || 'Curriculum-driven learning roadmap with evidence-based progress.';
  document.getElementById('overall').textContent = `${state.progress.overall}%`;
  document.getElementById('overallFill').style.width = `${state.progress.overall}%`;
  document.getElementById('topicCount').textContent = allTopics().length;
  document.getElementById('recommended').textContent = state.progress.recommendedNextTopic || 'None';
  document.getElementById('remaining').textContent = state.progress.estimatedRemainingWork;
  renderRoadmap();
  renderWorkspace();
}

function renderRoadmap(){
  const root = document.getElementById('roadmap');
  const phases = state.curriculum?.phases || [];
  const currentPhase = selectedPhase();
  root.innerHTML = '<div class="roadmap-shell"><div class="phase-rail"></div><div class="topic-list"></div></div>';
  const rail = root.querySelector('.phase-rail');
  const topicList = root.querySelector('.topic-list');
  phases.forEach(phase=>{
    const phaseProgress = state.progress.phases.find(p=>p.id===phase.id)?.completion || 0;
    const wrap = document.createElement('div');
    wrap.className = `phase ${phase.id===currentPhase?.id?'active':''}`;
    wrap.innerHTML = `
      <div class="phase-head">
        <button class="topic-select" data-action="select-phase"><span class="phase-name">${escapeHtml(phase.name)}</span><span class="phase-progress">${phaseProgress}%</span></button>
        <div class="phase-actions">
          <button class="icon-btn" data-action="phase-up" title="Move phase up">↑</button>
          <button class="icon-btn" data-action="phase-down" title="Move phase down">↓</button>
          <button class="icon-btn" data-action="phase-edit" title="Rename phase">✎</button>
          <button class="icon-btn" data-action="phase-delete" title="Delete phase">×</button>
        </div>
      </div>
    `;
    wrap.querySelector('[data-action="select-phase"]').addEventListener('click',()=>{ selectedPhaseId=phase.id; selectedTopicId=phaseTopics(phase)[0]?.id || null; activeTab='overview'; render(); });
    wrap.querySelector('[data-action="phase-up"]').addEventListener('click',()=>PhaseService.move(phase,'up'));
    wrap.querySelector('[data-action="phase-down"]').addEventListener('click',()=>PhaseService.move(phase,'down'));
    wrap.querySelector('[data-action="phase-edit"]').addEventListener('click',()=>PhaseService.rename(phase));
    wrap.querySelector('[data-action="phase-delete"]').addEventListener('click',()=>PhaseService.remove(phase));
    rail.appendChild(wrap);
  });
  const phase = currentPhase;
  topicList.innerHTML = `
    <div class="topic-list-head">
      <div>
        <div class="section-title" style="margin:0 0 4px">Topics</div>
        <div class="small">${phase ? escapeHtml(phase.name) : 'Select or create a phase.'}</div>
      </div>
    </div>
    <div class="topic-list-grid"></div>
  `;
  const grid = topicList.querySelector('.topic-list-grid');
  if(phase){
    phaseTopics(phase).forEach(topic=>{
      const row = document.createElement('div');
      row.className = `topic ${topic.id===selectedTopicId?'active':''}`;
      row.innerHTML = `
        <button class="topic-select">
          <span class="dot ${topic.status}"></span>
          <span class="topic-name">${escapeHtml(topic.name)}</span>
          <span class="topic-score">${topicCompletion(topic)}%</span>
        </button>
        <div class="topic-actions">
          <button class="icon-btn" data-action="topic-up" title="Move topic up">↑</button>
          <button class="icon-btn" data-action="topic-down" title="Move topic down">↓</button>
          <button class="icon-btn" data-action="topic-edit" title="Rename topic">✎</button>
          <button class="icon-btn" data-action="topic-delete" title="Delete topic">×</button>
        </div>
      `;
      row.querySelector('.topic-select').addEventListener('click',()=>{ selectedTopicId=topic.id; activeTab='overview'; render(); });
      row.querySelector('[data-action="topic-up"]').addEventListener('click',()=>TopicService.move(topic,'up'));
      row.querySelector('[data-action="topic-down"]').addEventListener('click',()=>TopicService.move(topic,'down'));
      row.querySelector('[data-action="topic-edit"]').addEventListener('click',()=>TopicService.rename(phase, topic));
      row.querySelector('[data-action="topic-delete"]').addEventListener('click',()=>TopicService.remove(topic));
      grid.appendChild(row);
    });
    const addTopic = document.createElement('button');
    addTopic.className = 'btn add-row';
    addTopic.textContent = 'Add Topic';
    addTopic.addEventListener('click',()=>TopicService.add(phase));
    topicList.appendChild(addTopic);
  }
  const addPhase = document.createElement('button');
  addPhase.className = 'btn primary phase-add';
  addPhase.textContent = 'Add Phase';
  addPhase.addEventListener('click',()=>PhaseService.add());
  rail.appendChild(addPhase);
}

function renderWorkspace(){
  const topic = selectedTopic();
  const root = document.getElementById('workspace');
  if(!topic){ root.innerHTML = '<div class="empty">Select a topic to open the workspace.</div>'; return; }
  const tabs = ['overview','resources','chat','notes'];
  if(!tabs.includes(activeTab)) activeTab = 'overview';
  root.innerHTML = `
    <div class="workspace-head">
      <div>
        <div class="topic-title">${escapeHtml(topic.name)}</div>
        <div class="subtitle">${escapeHtml(topic.description || 'No description extracted yet.')}</div>
      </div>
      <span class="status-pill ${topic.status}">${labelStatus(topic.status)} - ${topicCompletion(topic)}%</span>
    </div>
    <div class="tabs">
      ${tabs.map(tab=>`<button class="tab ${activeTab===tab?'active':''}" data-tab="${tab}">${tab[0].toUpperCase()+tab.slice(1)}</button>`).join('')}
    </div>
    <div id="tabBody"></div>
  `;
  root.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{ activeTab=btn.dataset.tab; renderWorkspace(); }));
  renderTab(topic);
}

function renderTab(topic){
  const body = document.getElementById('tabBody');
  if(activeTab === 'overview') renderOverview(body, topic);
  if(activeTab === 'resources') renderResources(body, topic);
  if(activeTab === 'chat') renderChat(body, topic);
  if(activeTab === 'notes') renderNotes(body, topic);
}

function renderOverview(body, topic){
  body.innerHTML = `
    <div class="two-col">
      <div class="card"><h3>Learning Objectives</h3>${list(topic.objectives)}</div>
      <div class="card"><h3>Completion Checklist</h3>${list(criteriaFor(topic))}</div>
      <div class="card"><h3>Deliverables</h3>${list(topic.deliverables)}</div>
      <div class="card"><h3>Progress</h3><p>${topicCompletion(topic)}%</p><p>${topic.manualOverride?.completed ? 'Manually completed' : 'Tracked from topic status'}</p></div>
    </div>
  `;
}

function renderResources(body, topic){
  const resources = topicResources(topic);
  body.innerHTML = `
    <div class="workspace-head">
      <div>
        <div class="section-title" style="margin-top:0">Resources</div>
        ${resources.length ? '<div class="small">Cached resources for this topic.</div>' : '<div class="small">No resources loaded.</div>'}
      </div>
      <button class="btn primary" id="resourceSearchBtn">${resources.length ? 'Refresh Resources' : 'Find Resources'}</button>
    </div>
    <div id="resourceResults">${resources.length ? resourceCards(resources) : '<div class="empty">No resources loaded.</div>'}</div>
  `;
  document.getElementById('resourceSearchBtn').addEventListener('click',()=>findResources(body, topic, resources.length > 0));
}

async function findResources(body, topic, refresh){
  const results = document.getElementById('resourceResults');
  const button = document.getElementById('resourceSearchBtn');
  button.disabled = true;
  button.textContent = refresh ? 'Refreshing...' : 'Finding...';
  results.innerHTML = '<div class="empty">Finding resources...</div>';
  try{
    const response = await apiRequest(`/api/topics/${topic.id}/resources${refresh ? '?refresh=true' : ''}`);
    const payload = await readApiJson(response, 'Resource discovery failed');
    topic.resources = payload.resources;
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  }catch(error){
    results.innerHTML = `<div class="empty">${escapeHtml(error.message)}<div style="height:12px"></div><button class="btn" id="retryResourcesBtn">Retry</button></div>`;
    document.getElementById('retryResourcesBtn').addEventListener('click',()=>findResources(body, topic, refresh));
    button.disabled = false;
    button.textContent = refresh ? 'Refresh Resources' : 'Find Resources';
    return;
  }
  const resources = topicResources(topic);
  results.innerHTML = resources.length ? resourceCards(resources) : '<div class="empty">No suitable resources were found for this topic.</div>';
  button.disabled = false;
  button.textContent = resources.length ? 'Refresh Resources' : 'Find Resources';
}

function topicResources(topic){ return [...(topic.resources?.static||[]), ...(topic.resources?.dynamic||[])]; }
function resourceCards(resources){
  return resources.map(resource=>`
    <div class="resource">
      <div class="resource-source">${escapeHtml(resource.source || resource.type || hostFor(resource.url) || 'Resource')}</div>
      <div class="resource-title">${escapeHtml(resource.title || resource.url || 'Resource')}</div>
      <div class="resource-description">${escapeHtml(resource.description || resource.reason || 'Useful supporting material for this topic.')}</div>
      <a href="${escapeAttr(resource.url || '#')}" target="_blank" rel="noreferrer">Open</a>
    </div>
  `).join('');
}

function renderChat(body, topic){
  body.innerHTML = `
    <div class="field-row">
      <textarea id="chatQuestion" placeholder="Ask about this topic, missing work, architecture, bugs or next steps."></textarea>
      <button class="btn primary" id="askBtn">Ask</button>
    </div>
    <div style="height:14px"></div>
    <div id="chatHistory">${(topic.chatHistory||[]).slice().reverse().map(item=>`
      <div class="card" style="margin-bottom:10px">
        <h3>${escapeHtml(item.question || 'Mentor')}</h3>
        <p>${escapeHtml(item.reply).replace(/\n/g,'<br>')}</p>
      </div>
    `).join('') || '<div class="empty">No topic chat yet.</div>'}</div>
  `;
  document.getElementById('askBtn').addEventListener('click', async()=>{
    const question = document.getElementById('chatQuestion').value.trim();
    if(!question) return;
    try{
      const response = await apiRequest(`/api/topics/${topic.id}/mentor`, { method:'POST', body:JSON.stringify({question}) });
      const payload = await readApiJson(response, 'Mentor request failed');
      Object.assign(topic, payload.topic);
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    }catch(error){
      showToast(error.message);
    }
    renderChat(body, topic);
  });
}

function renderNotes(body, topic){
  body.innerHTML = `<textarea id="notesBox" placeholder="Personal notes for this topic.">${escapeHtml(topic.notes || '')}</textarea>`;
  document.getElementById('notesBox').addEventListener('input', e=>{ topic.notes = e.target.value; scheduleSave(); });
}

function criteriaFor(topic){ return [...(topic.successCriteria||[]), ...(topic.deliverables||[]), ...(topic.objectives||[])].filter(Boolean).length ? [...(topic.successCriteria||[]), ...(topic.deliverables||[]), ...(topic.objectives||[])].filter(Boolean) : [topic.name]; }
function list(items){ return items && items.length ? `<ul>${items.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}</ul>` : '<p>None stored.</p>'; }
function labelStatus(status){ return ({complete:'Complete',partial:'Partial',not_verified:'Not Verified',missing:'Missing'})[status] || status; }
function hostFor(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch{ return ''; } }
function escapeHtml(value){ const div=document.createElement('div'); div.textContent=value == null ? '' : String(value); return div.innerHTML; }
function escapeAttr(value){ return escapeHtml(value).replace(/"/g,'&quot;'); }
function showToast(message){ const toast=document.getElementById('toast'); toast.textContent=message; toast.style.display='block'; setTimeout(()=>toast.style.display='none',3600); }

document.getElementById('saveBtn').addEventListener('click',()=>persist().then(()=>showToast('Saved.')));
document.getElementById('projectButton').addEventListener('click',()=>ProjectSelector.toggle());
document.addEventListener('click',event=>{
  if(!event.target.closest('.project-selector')) document.getElementById('projectMenu').classList.remove('open');
});

loadState();
</script>
</body>
</html>
