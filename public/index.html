<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Work Smoothie</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#090A0D;
  --text:#F4F5F7;
  --orange:#F5893A;
  --green:#42D392;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  min-height:100vh;
  background:#090A0D;
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  overflow:hidden;
}
button{font-family:inherit}
.landing{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    linear-gradient(90deg, rgba(9,10,13,.88) 0%, rgba(9,10,13,.68) 44%, rgba(9,10,13,.18) 100%),
    url('./assets/teamwork-smoothie-hero.png') center / cover no-repeat;
  position:relative;
  overflow:hidden;
}
.landing::after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:32%;
  background:linear-gradient(180deg, transparent, rgba(9,10,13,.48));
  pointer-events:none;
}
.landing-inner{
  width:min(1180px,100%);
  position:relative;
  z-index:1;
}
.landing-copy{
  width:min(980px,100%);
  display:grid;
  gap:20px;
  align-content:center;
  min-height:calc(100vh - 48px);
  padding:44px 0;
}
.landing-brand{
  display:flex;
  align-items:center;
  gap:11px;
  color:#fff;
  font-size:23px;
  font-weight:900;
}
.landing-mark{
  width:63px;
  height:63px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,#ffb84d,var(--orange));
  color:#171007;
  box-shadow:0 18px 46px rgba(245,137,58,.26);
}
h1{
  font-size:clamp(72px,12vw,138px);
  line-height:.95;
  max-width:980px;
  font-weight:900;
  letter-spacing:0;
}
.landing-subtitle{
  max-width:720px;
  color:#E9EDF1;
  font-size:30px;
  line-height:1.55;
}
.landing-steps{
  display:grid;
  gap:12px;
  max-width:430px;
}
.landing-step{
  display:flex;
  align-items:center;
  gap:12px;
  color:#fff;
  font-size:27px;
  font-weight:800;
}
.check{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  background:var(--green);
  color:#07130d;
  font-weight:900;
}
.start-button{
  width:max-content;
  min-width:170px;
  border:0;
  background:var(--orange);
  color:#160c04;
  padding:23px 33px;
  border-radius:8px;
  font-size:24px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 20px 52px rgba(245,137,58,.28);
}
.start-button:hover{background:#ff9c4c}
.start-button:focus-visible{
  outline:3px solid #fff;
  outline-offset:4px;
}

@media (max-width:900px){
  body{overflow:auto}
  .landing{
    min-height:100svh;
    place-items:start;
    background:
      linear-gradient(180deg, rgba(9,10,13,.9) 0%, rgba(9,10,13,.72) 52%, rgba(9,10,13,.2) 100%),
      url('./assets/teamwork-smoothie-hero.png') 64% center / cover no-repeat;
  }
  .landing-copy{min-height:100svh;padding:28px 0 34px;gap:20px}
  .landing-brand{font-size:18px}
  .landing-mark{width:50px;height:50px}
  h1{font-size:72px}
  .landing-subtitle{font-size:26px}
  .landing-step{font-size:24px}
}
</style>
</head>
<body>
<main class="landing">
  <div class="landing-inner">
    <div class="landing-copy">
      <div class="landing-brand">
        <div class="landing-mark">T</div>
        <span>Team Work Smoothie</span>
      </div>
      <h1>Team Work Smoothie</h1>
      <p class="landing-subtitle">Start a group project without feeling lost. Let the AI guide your team from confusion to a clear way forward.</p>
      <div class="landing-steps" aria-label="Guided phases">
        <div class="landing-step"><span class="check" aria-hidden="true">✓</span><span>Understand the Task</span></div>
        <div class="landing-step"><span class="check" aria-hidden="true">✓</span><span>Break down the task</span></div>
        <div class="landing-step"><span class="check" aria-hidden="true">✓</span><span>Do the task!</span></div>
      </div>
      <button class="start-button" id="startBtn">Start</button>
    </div>
  </div>
</main>

<script>
document.getElementById('startBtn').addEventListener('click',()=>{
  window.location.assign('./dashboard.html');
});
</script>
</body>
</html>
