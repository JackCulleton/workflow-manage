openapi: 3.1.0
info:
  title: Mountain Scope Curriculum Engine
  description: Read, edit, mentor and track curriculum-driven learning roadmaps.
  version: 3.0.0
servers:
  - url: https://workflow-manage.vercel.app/api
paths:
  /workflow:
    get:
      operationId: getWorkflow
      summary: Read the full stored Mountain Scope state.
      responses:
        '200':
          description: Current workflow and curriculum state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'
    put:
      operationId: replaceWorkflow
      summary: Replace the full workflow after a deliberate bulk edit.
      description: Replaces the single stored workflow. Legacy multi-project payloads are migrated to one selected project and backed up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow]
              properties:
                workflow:
                  $ref: '#/components/schemas/Workflow'
      responses:
        '200': { description: Workflow saved }
  /curriculum:
    get:
      operationId: getCurriculum
      summary: Read the stored curriculum and computed progress.
      responses:
        '200':
          description: Stored curriculum
          content:
            application/json:
              schema:
                type: object
                properties:
                  curriculum: { $ref: '#/components/schemas/Curriculum' }
                  progress: { $ref: '#/components/schemas/Progress' }
  /progress:
    get:
      operationId: getProgress
      summary: Recalculate and return derived completion and progress intelligence.
      responses:
        '200':
          description: Computed progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  progress: { $ref: '#/components/schemas/Progress' }
  /phases:
    post:
      operationId: addPhase
      summary: Add a phase to the roadmap.
      description: Adds a phase to the dashboard's single stored project. There is no active project fallback or project selector.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '201': { description: Phase added }
  /phases/{phaseId}:
    patch:
      operationId: updatePhase
      summary: Rename or update a phase.
      description: Updates the phase with the exact phaseId inside the single stored project.
      parameters:
        - name: phaseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                assignedMemberIds:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: Phase updated }
    delete:
      operationId: deletePhase
      summary: Delete a phase and all topics inside it.
      description: Deletes the phase with the exact phaseId inside the single stored project.
      parameters:
        - name: phaseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Phase deleted }
  /phases/{phaseId}/move:
    post:
      operationId: movePhase
      summary: Move a phase up or down.
      description: Moves the phase with the exact phaseId inside the single stored project.
      parameters:
        - name: phaseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction:
                  type: string
                  enum: [up, down]
      responses:
        '200': { description: Phase moved }
  /topics:
    post:
      operationId: addTopic
      summary: Add a topic to an existing phase.
      description: Adds a topic to the exact phaseId inside the dashboard's single stored project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phaseId, name]
              properties:
                phaseId: { type: string }
                name: { type: string }
                description: { type: string }
                status: { $ref: '#/components/schemas/TopicStatus' }
                objectives:
                  type: array
                  items: { type: string }
                deliverables:
                  type: array
                  items: { type: string }
                successCriteria:
                  type: array
                  items: { type: string }
                keywords:
                  type: array
                  items: { type: string }
      responses:
        '201': { description: Topic added }
  /topics/{topicId}:
    patch:
      operationId: updateTopic
      summary: Update topic curriculum fields or status.
      description: Updates the topic with the exact topicId inside the single stored project.
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                status: { $ref: '#/components/schemas/TopicStatus' }
                activities:
                  type: array
                  items: { $ref: '#/components/schemas/Activity' }
                assignedMemberIds:
                  type: array
                  items: { type: string }
                objectives:
                  type: array
                  items: { type: string }
                deliverables:
                  type: array
                  items: { type: string }
                successCriteria:
                  type: array
                  items: { type: string }
                keywords:
                  type: array
                  items: { type: string }
                notes: { type: string }
      responses:
        '200': { description: Topic updated }
    delete:
      operationId: deleteTopic
      summary: Delete a topic and its cached resources/progress.
      description: Deletes the topic with the exact topicId inside the single stored project.
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Topic deleted }
  /topics/{topicId}/move:
    post:
      operationId: moveTopic
      summary: Move a topic up or down within its phase.
      description: Moves the topic with the exact topicId inside the single stored project.
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction:
                  type: string
                  enum: [up, down]
      responses:
        '200': { description: Topic moved }
  /topics/{topicId}/resources:
    get:
      operationId: getTopicResources
      summary: Return cached resources for a topic, or refresh them when explicitly requested.
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string }
        - name: refresh
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200': { description: Topic resources }
  /topics/{topicId}/mentor:
    post:
      operationId: askTopicMentor
      summary: Ask the topic mentor using stored curriculum context and notes.
      description: Uses the topic with the exact topicId inside the single stored project.
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string }
      responses:
        '200': { description: Mentor reply }
  /topics/{topicId}/notes:
    patch:
      operationId: updateTopicNotes
      summary: Update personal notes for a topic without changing the official curriculum.
      description: Updates notes for the topic with the exact topicId inside the single stored project.
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        '200': { description: Notes updated }
  /topics/{topicId}/manual-override:
    patch:
      operationId: setManualOverride
      summary: Mark or clear a transparent manual completion override.
      description: Marks or clears completion for the topic with the exact topicId inside the single stored project.
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                completed: { type: boolean }
                reason: { type: string }
      responses:
        '200': { description: Manual override updated }
  /assignments/phases/assign:
    post:
      operationId: assignMemberToPhase
      summary: Assign an existing team member to an existing phase.
      description: Assigns an existing team member to an existing phase in the dashboard's single workflow. Prefer phaseId and memberId when known, but phaseName and memberName are supported for GPT delegation. Names must match exactly enough to be unambiguous. The stored assignment always uses the stable member ID and does not change progress or completion status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhaseAssignmentRequest'
      responses:
        '200': { description: Phase assignment updated }
  /assignments/phases/unassign:
    post:
      operationId: unassignMemberFromPhase
      summary: Remove an existing team member assignment from an existing phase.
      description: Removes an existing team member from an existing phase assignment in the dashboard's single workflow. Prefer phaseId and memberId when known, but phaseName and memberName are supported when unambiguous. It does not change progress, completion status, topics, or phase content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhaseAssignmentRequest'
      responses:
        '200': { description: Phase assignment updated }
  /assignments/topics/assign:
    post:
      operationId: assignMemberToTopic
      summary: Assign an existing team member to an existing topic.
      description: Assigns an existing team member to an existing topic in the dashboard's single workflow. Prefer topicId and memberId when known, but topicName and memberName are supported for GPT delegation. If topicName is ambiguous, include phaseId or phaseName. The stored assignment always uses the stable member ID and does not change progress or completion status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicAssignmentRequest'
      responses:
        '200': { description: Topic assignment updated }
  /assignments/topics/unassign:
    post:
      operationId: unassignMemberFromTopic
      summary: Remove an existing team member assignment from an existing topic.
      description: Removes an existing team member from an existing topic assignment in the dashboard's single workflow. Prefer topicId and memberId when known, but topicName and memberName are supported when unambiguous. It does not change progress, completion status, phases, or topic content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicAssignmentRequest'
      responses:
        '200': { description: Topic assignment updated }
  /assignments/batch:
    post:
      operationId: setAssignments
      summary: Atomically replace assignments on existing phases or topics.
      description: Sets team-member assignments for existing phases or topics in the dashboard's single workflow. Prefer IDs when known, but memberNames plus targetName are supported when unambiguous. All members and targets are validated before any write; invalid input fails without partial updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items: { $ref: '#/components/schemas/AssignmentSetItem' }
      responses:
        '200': { description: Assignments updated }
components:
  schemas:
    TopicStatus:
      type: string
      enum: [complete, partial, not_verified, missing]
    Resource:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string }
        description: { type: string }
        url: { type: string }
        type: { type: string }
    Activity:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        completionRequirements:
          type: array
          items: { type: string }
    TeamMember:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
    PhaseAssignmentRequest:
      type: object
      allOf:
        - anyOf:
            - required: [phaseId]
            - required: [phaseName]
        - anyOf:
            - required: [memberId]
            - required: [memberName]
      properties:
        phaseId: { type: string }
        phaseName: { type: string }
        memberId: { type: string }
        memberName: { type: string }
    TopicAssignmentRequest:
      type: object
      allOf:
        - anyOf:
            - required: [topicId]
            - required: [topicName]
        - anyOf:
            - required: [memberId]
            - required: [memberName]
      properties:
        topicId: { type: string }
        topicName: { type: string }
        phaseId:
          type: string
          description: Optional disambiguation when topicName is not unique.
        phaseName:
          type: string
          description: Optional disambiguation when topicName is not unique.
        memberId: { type: string }
        memberName: { type: string }
    AssignmentSetItem:
      type: object
      required: [targetType]
      allOf:
        - anyOf:
            - required: [targetId]
            - required: [targetName]
        - anyOf:
            - required: [memberIds]
            - required: [memberNames]
      properties:
        targetType:
          type: string
          enum: [phase, topic]
        targetId: { type: string }
        targetName: { type: string }
        phaseId:
          type: string
          description: Optional disambiguation when targetType is topic and targetName is not unique.
        phaseName:
          type: string
          description: Optional disambiguation when targetType is topic and targetName is not unique.
        memberIds:
          type: array
          items: { type: string }
        memberNames:
          type: array
          items: { type: string }
    Topic:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        assignedMemberIds:
          type: array
          items: { type: string }
        objectives:
          type: array
          items: { type: string }
        deliverables:
          type: array
          items: { type: string }
        successCriteria:
          type: array
          items: { type: string }
        keywords:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/TopicStatus' }
        completion: { type: number }
        confidence: { type: number }
        notes: { type: string }
        manualOverride:
          type: object
          properties:
            completed: { type: boolean }
            reason: { type: string }
            updatedAt: { type: string }
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        teamMembers:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
        phases:
          type: array
          items: { $ref: '#/components/schemas/Phase' }
    Phase:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        assignedMemberIds:
          type: array
          items: { type: string }
        topics:
          type: array
          items: { $ref: '#/components/schemas/Topic' }
    Curriculum:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        source:
          type: object
          additionalProperties: true
        phases:
          type: array
          items: { $ref: '#/components/schemas/Phase' }
        glossary:
          type: array
          items: { type: object, additionalProperties: true }
        resources:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
    Progress:
      type: object
      properties:
        overall: { type: number }
        phases:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              completion: { type: number }
        strongestTopics:
          type: array
          items: { type: string }
        needsImprovement:
          type: array
          items: { type: string }
        recommendedNextTopic: { type: string }
        estimatedRemainingWork: { type: string }
    Workflow:
      type: object
      required: [title, subtitle, project, phases]
      properties:
        title: { type: string }
        subtitle: { type: string }
        project: { $ref: '#/components/schemas/Project' }
        teamMembers:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
        curriculum: { $ref: '#/components/schemas/Curriculum' }
        phases:
          type: array
          items: { $ref: '#/components/schemas/Phase' }
        progress: { $ref: '#/components/schemas/Progress' }
        migrationBackups:
          type: array
          items:
            type: object
            additionalProperties: true
    WorkflowResponse:
      type: object
      properties:
        success: { type: boolean }
        project: { $ref: '#/components/schemas/Project' }
        workflow: { $ref: '#/components/schemas/Workflow' }
